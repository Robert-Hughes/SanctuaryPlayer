[package]
name = "sanctuary-player-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
bytemuck = "1"
wgpu.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_extras.workspace = true
pollster.workspace = true
ringbuf.workspace = true
chrono.workspace = true
log.workspace = true
oxideav.workspace = true
oxideav-meta.workspace = true
oxideav-pixfmt.workspace = true
oxideav-audio-filter.workspace = true
oxideav-hls.workspace = true

regex = "1"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
winit.workspace = true
egui-winit.workspace = true
oxideav-sysaudio = { workspace = true, features = ["alsa", "pulse", "pipewire", "oss", "wasapi", "asio", "coreaudio"] }

[target.'cfg(target_os = "android")'.dependencies]
oxideav-sysaudio = { workspace = true, features = ["aaudio"] }
oxideav-mediacodec.workspace = true
ash = "0.38"

[target.'cfg(target_os = "freebsd")'.dependencies]
ash = "0.38"
glow = "0.17"
x11-dl = "2.21"
oxideav-vdpau.workspace = true

[dev-dependencies]
oxideav-sysaudio = { workspace = true, features = ["mock"] }

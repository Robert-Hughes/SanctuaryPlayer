[package]
name = "sanctuary-player-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "main"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
sanctuary-player-app = { path = "../app" }
log.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }

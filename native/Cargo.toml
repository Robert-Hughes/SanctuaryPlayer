[workspace]
members = [
    "app",
    "desktop",
    "android",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Robert-Hughes/SanctuaryPlayer"

[workspace.dependencies]
winit = "0.30"
wgpu = "29"
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false, features = ["clipboard", "links"] }
egui-wgpu = { version = "0.34", default-features = false }
egui_extras = { version = "0.34", default-features = false, features = ["svg"] }
pollster = "0.4"
ringbuf = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
log = "0.4"

# OxideAV is consumed through its public facade plus the explicit registry
# aggregator. Keep the enabled media surface narrow while native playback is
# brought up; add codecs/sources when SanctuaryPlayer actually needs them.
oxideav = "0.0.3"
oxideav-meta = { version = "0.0.1", default-features = false, features = [
    "aac",
    "h264",
    "mp4",
    "mpegts",
    "source",
    "http",
    "hls",
    "vdpau",
] }
oxideav-pixfmt = "0.1"
oxideav-audio-filter = "0.1"
oxideav-sysaudio = { version = "0.1", default-features = false }
oxideav-hls = "0.1"
oxideav-vdpau = "0.0.2"

# Sanctuary's public dependency contract is the `dev` branch of the
# project-maintained OxideAV forks. Cargo.lock pins the exact Git revisions
# used by a committed SanctuaryPlayer revision. Local co-development overrides
# these entries from native/.cargo/config.toml; see OXIDEAV.md.
[patch.crates-io]
oxideav = { git = "https://github.com/OxideAV/oxideav.git", branch = "master" }
oxideav-core = { git = "https://github.com/Robert-Hughes/oxideav-core.git", branch = "dev" }
oxideav-pipeline = { git = "https://github.com/Robert-Hughes/oxideav-pipeline.git", branch = "dev" }
oxideav-meta = { git = "https://github.com/Robert-Hughes/oxideav-meta.git", branch = "dev" }
oxideav-sysaudio = { git = "https://github.com/Robert-Hughes/oxideav-sysaudio.git", branch = "dev" }
oxideav-aac = { git = "https://github.com/Robert-Hughes/oxideav-aac.git", branch = "dev" }
oxideav-h264 = { git = "https://github.com/Robert-Hughes/oxideav-h264.git", branch = "dev" }
oxideav-http = { git = "https://github.com/Robert-Hughes/oxideav-http.git", branch = "dev" }
oxideav-hls = { git = "https://github.com/Robert-Hughes/oxideav-hls.git", branch = "dev" }
oxideav-vdpau = { git = "https://github.com/Robert-Hughes/oxideav-vdpau.git", branch = "dev" }

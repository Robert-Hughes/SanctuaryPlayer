[workspace]
members = [
    "app",
    "desktop",
    "android",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Robert-Hughes/SanctuaryPlayer"

[workspace.dependencies]
winit = "0.30"
wgpu = "29"
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false, features = ["clipboard", "links"] }
egui-wgpu = { version = "0.34", default-features = false }
egui_extras = { version = "0.34", default-features = false, features = ["svg"] }
pollster = "0.4"

# OxideAV is consumed through its public facade plus the explicit registry
# aggregator. Keep the enabled media surface narrow while native playback is
# brought up; add codecs/sources when SanctuaryPlayer actually needs them.
oxideav = "0.0.3"
oxideav-meta = { version = "0.0.1", default-features = false, features = [
    "aac",
    "h264",
    "mp4",
    "mpegts",
    "source",
    "http",
    "hls",
] }
oxideav-pixfmt = "0.1"
oxideav-audio-filter = "0.1"
oxideav-sysaudio = "0.1"

# Development uses the experimental OxideAV checkouts while retaining normal
# versioned dependencies above. Patch every OxideAV crate in the selected
# dependency graph so Cargo cannot mix local and crates.io type identities.
[patch.crates-io]
oxideav = { path = "../../oxideav/crates/oxideav" }
oxideav-core = { path = "../../oxideav/crates/oxideav-core" }
oxideav-pipeline = { path = "../../oxideav/crates/oxideav-pipeline" }
oxideav-source = { path = "../../oxideav/crates/oxideav-source" }
oxideav-meta = { path = "../../oxideav/crates/oxideav-meta" }
oxideav-pixfmt = { path = "../../oxideav/crates/oxideav-pixfmt" }
oxideav-audio-filter = { path = "../../oxideav/crates/oxideav-audio-filter" }
oxideav-sysaudio = { path = "../../oxideav/crates/oxideav-sysaudio" }
oxideav-aac = { path = "../../oxideav/crates/oxideav-aac" }
oxideav-h264 = { path = "../../oxideav/crates/oxideav-h264" }
oxideav-mp4 = { path = "../../oxideav/crates/oxideav-mp4" }
oxideav-mpegts = { path = "../../oxideav/crates/oxideav-mpegts" }
oxideav-http = { path = "../../oxideav/crates/oxideav-http" }
oxideav-hls = { path = "../../oxideav/crates/oxideav-hls" }
